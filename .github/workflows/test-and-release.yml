name: Test and Release

# Run this job on all pushes and pull requests
# as well as tags with a semantic version
on:
  push:
    branches:
      - "main"
    tags:
      # normal versions
      - "v[0-9]+.[0-9]+.[0-9]+"
      # pre-releases
      - "v[0-9]+.[0-9]+.[0-9]+-**"
  pull_request: {}
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish to npm (e.g. v0.1.0)'
        required: true

# Cancel previous PR/branch runs when a new commit is pushed
concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Performs quick checks before the expensive test runs
  check-and-lint:
    if: contains(github.event.head_commit.message, '[skip ci]') == false

    runs-on: ubuntu-latest

    steps:
      - uses: ioBroker/testing-action-check@v2
        with:
          node-version: '22.x'
          # Uncomment the following line if your adapter cannot be installed using 'npm ci'
          # install-command: 'npm install'
          lint: true

  # Runs adapter tests on all supported node versions and OSes
  adapter-tests:
    needs: [check-and-lint]
    if: contains(github.event.head_commit.message, '[skip ci]') == false

    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        node-version: [22.x, 24.x, 26.x]
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: ioBroker/testing-action-adapter@v1
        with:
          node-version: ${{ matrix.node-version }}
          os: ${{ matrix.os }}
          # Uncomment the following line if your adapter cannot be installed using 'npm ci'
          # install-command: 'npm install'

  # Creates a DRAFT GitHub release for every version tag (v*). Does NOT publish to npm.
  # Publishing the draft on GitHub (button "Publish release") is the explicit command that releases to npm.
  github-release:
    needs: [check-and-lint, adapter-tests]
    if: |
      contains(github.event.head_commit.message, '[skip ci]') == false &&
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --generate-notes ${{ contains(github.ref_name, '-') && '--prerelease' || '--latest' }}

  # Pushing a version tag (v1.2.3) publishes the GitHub release and then npm. Pre-release tags (v1.2.3-beta.1)
  # only create a GitHub pre-release. A release published by hand or a manual start also publishes to npm.
  # Uses npm trusted publishing (OIDC), no secret needed.
  deploy:
    needs: [github-release]
    if: |
      !cancelled() && (
        github.event_name == 'release' ||
        github.event_name == 'workflow_dispatch' ||
        (needs.github-release.result == 'success' && contains(github.ref_name, '-') == false)
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'
      - name: Check that the tag matches the package version
        run: |
          TAG="${{ github.event.release.tag_name || inputs.tag || github.ref_name }}"
          VER=$(node -p "require('./package.json').version")
          if [ "$TAG" != "v$VER" ]; then echo "Tag $TAG does not match package.json version $VER"; exit 1; fi
      - run: npm ci
      - run: npm run lint
      - run: npm run test:package
      - run: npm publish --access public
